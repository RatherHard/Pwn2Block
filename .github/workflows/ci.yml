name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 题目包的 flag 只写 `"flag": "env:FLAG_<ID>"`，真值绝不进仓库（06 §6、07 §7）。
      # 一旦 `challenges/` 下有真实题目，`challenge:check` / `challenge:solve` 就需要这个变量，
      # 否则校验器按设计报「环境变量缺失，拒绝加载该题」（08 §5 S05）。
      # 这里注入的是**测试哨兵值**，不是真 flag；各题按 id 追加自己的变量。
      FLAG_RET2WIN: pwn2block-ci-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: 单元与集成测试
        run: pnpm test
      - name: 构建前端产物
        run: pnpm build
      - name: 校验全部题目包
        run: pnpm challenge:check --all
      - name: 跑全部题目参考解法
        run: pnpm challenge:solve --all
