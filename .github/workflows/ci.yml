name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 题目包的 flag 只写 `"flag": "env:FLAG_<ID>"`，真值绝不进仓库（06 §6、07 §7）。
      # 一旦 `challenges/` 下有真实题目，`challenge:check` / `challenge:solve` 就需要这个变量，
      # 否则校验器按设计报「环境变量缺失，拒绝加载该题」（08 §5 S05）。
      # 这里注入的是**测试哨兵值**，不是真 flag；各题按 id 追加自己的变量。
      # 新题落地时必须在同一个提交里补上它的变量，否则 `--all` 会因缺 env 拒绝加载该题（那是设计的正确行为，不是 CI 故障）。
      FLAG_RET2WIN: pwn2block-ci-sentinel
      FLAG_ENDIAN: pwn2block-ci-sentinel
      FLAG_PUSHPOP: pwn2block-ci-sentinel
      FLAG_CALLRET: pwn2block-ci-sentinel
      FLAG_STACKFRAME: pwn2block-ci-sentinel
      FLAG_LOCALVAR: pwn2block-ci-sentinel
      FLAG_RET2ROP: pwn2block-ci-sentinel
      # CI 里 docker 与 python3 都在：要求真实隔离后端真的跑起来，缺一就失败而不是 skip。
      PWN2BLOCK_REQUIRE_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # `python-real.test.ts` 不在测试里拉镜像（避免依赖网络）；CI 先显式拉好，再让真实
      # docker 后端用例执行。`PWN2BLOCK_REQUIRE_PYTHON=1` 会把「镜像缺席」从 skip 变成失败。
      - name: 拉取 Python 隔离镜像
        run: docker pull python:3.12-alpine
      - name: 类型检查
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # P6：运行器自测只用标准库，ubuntu-latest 自带 python3，所以这条在 CI 里是真跑的。
      # 服务端那组真实解释器用例由 `pnpm test` 驱动；docker 后端用例在守护进程或镜像缺席时
      # 整组跳过——跳过不等于通过，报告里必须写明。
      - name: Python 运行器单元测试
        working-directory: packages/python-runner
        run: python3 -m unittest discover -s . -p "test_*.py" -v
      # 必须在测试之前构建：`packages/server/test/c04-static.test.ts` 里有两条**真实产物**用例
      # （对 `packages/web/dist` 实际发请求），产物缺席时整组跳过。先构建才能让静态托管与发布
      # 边界在 CI 里真的被执行，而不是被 skip 掉当成通过。
      - name: 构建前端产物
        run: pnpm build
      - name: 单元与集成测试
        run: pnpm test
      - name: 校验全部题目包
        run: pnpm challenge:check --all
      - name: 跑全部题目参考解法
        run: pnpm challenge:solve --all
      - name: 安装 Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: 启动真实后端
        env:
          FLAG_RET2WIN: flag{e2e-graph}
          PORT: '8787'
        run: |
          pnpm start > /tmp/pwn2block-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pwn2block-server.log
          exit 1
      - name: 浏览器端到端（真实后端 + 生产构建）
        env:
          PWN2BLOCK_E2E: '1'
          PWN2BLOCK_BASE_URL: http://127.0.0.1:8787
          PWN2BLOCK_E2E_OUTPUT_DIR: .tmp/ci-e2e
          FLAG_RET2WIN: flag{e2e-graph}
        run: pnpm e2e
      - name: 保存 E2E 失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            .tmp/ci-e2e
            /tmp/pwn2block-server.log
          if-no-files-found: ignore
